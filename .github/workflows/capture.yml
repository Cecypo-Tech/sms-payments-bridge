name: capture
# Screenshots and clips of the app's screens from an emulator, with fictional data. Run by hand.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Throwaway certificate for the stand-in server
        run: >
          openssl req -x509 -newkey rsa:2048 -nodes -days 2
          -keyout "$RUNNER_TEMP/capture.key" -out app/src/debug/res/raw/capture_ca.pem
          -subj "/CN=erp.acme-hardware.example" -addext "subjectAltName=DNS:erp.acme-hardware.example"
      - run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURE_KEY: ${{ runner.temp }}/capture.key
          OUT: capture-out
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash capture/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-out
          path: capture-out
