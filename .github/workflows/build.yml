name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
      - name: Test and assemble
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ks.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle test assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sms-payments-bridge-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-release.apk
