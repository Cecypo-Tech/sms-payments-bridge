name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
      - name: Test and assemble
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ks.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle test assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sms-payments-bridge-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-release.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches versionName
        run: |
          V=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versionName $V"; exit 1; }
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: sms-payments-bridge-${{ steps.sha.outputs.short }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk sms-payments-bridge.apk
          gh release create "$GITHUB_REF_NAME" sms-payments-bridge.apk --verify-tag --generate-notes --title "SMS Payments Bridge $GITHUB_REF_NAME"
